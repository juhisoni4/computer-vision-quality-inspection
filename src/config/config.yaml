model:
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 16
  img_height: 256
  img_width: 256
  in_channels: 3
  num_classes: 4
  num_workers: 2
  trail: 1

training:
  epochs: 25
  seed: 42

data:
  data_path: "src/data/train.csv"
  train_img_dir: "src/data/train_images"
  test_img_dir: "src/data/test_images"